name: Publish Stratumind API image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private source ref to build
        required: true
        default: stratumind-v1.18.2
        type: string
      image_tag:
        description: Public GHCR tag to publish
        required: true
        default: api-v1.1.7
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ln-one/stratumind

jobs:
  publish:
    name: Publish multi-architecture API image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record source commit
        id: source
        shell: bash
        run: printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          build-args: |
            GIT_COMMIT_ID=${{ steps.source.outputs.commit }}
          labels: |
            org.opencontainers.image.title=Stratumind API
            org.opencontainers.image.description=Stratumind API runtime for exact-rank retrieval
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=https://github.com/ln-one/Stratumind-Production
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4

      - name: Sign published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --new-bundle-format=false --use-signing-config=false --yes \
            "${IMAGE_REF}:${IMAGE_TAG}@${IMAGE_DIGEST}"

      - name: Verify published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REF}:${IMAGE_TAG}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$image" >/dev/null
          docker pull "$image" >/dev/null
          docker run --rm --entrypoint /bin/sh "$image" -c \
            '! test -d /qdrant/src && ! test -d /qdrant/lib && ! test -d /usr/local/cargo/registry/src && ! test -d /usr/local/cargo/git/checkouts && ! find /qdrant -type f -name "*.map" -print -quit | grep -q .' 

          container="stratumind-api-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" --publish 127.0.0.1:6333:6333 "$image" >/dev/null
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:6333/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "Stratumind API did not become ready on port 6333" >&2
              exit 1
            fi
            sleep 2
          done

          collection="stratumind-smoke-${GITHUB_RUN_ID}"
          curl --fail --silent --show-error \
            --request PUT \
            --header 'content-type: application/json' \
            --data '{"vectors":{"dense":{"size":2,"distance":"Cosine"}},"sparse_vectors":{"sparse":{"modifier":"idf"}}}' \
            "http://127.0.0.1:6333/collections/${collection}" >/dev/null
          curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"exact_rrf":{"dense":{"query":[1,0],"using":"dense"},"sparse":{"query":{"text":"smoke","model":"qdrant/bm25"},"using":"sparse"},"k":60,"weights":[0.5,0.5]},"limit":1,"filter":{"must":[]}}' \
            "http://127.0.0.1:6333/collections/${collection}/points/query/exact-rrf" >/dev/null

      - name: Record image digest and source commit
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          printf '{"image":"%s@%s","tag":"%s","sourceCommit":"%s"}\n' \
            "$IMAGE_REF" "$IMAGE_DIGEST" "$IMAGE_TAG" "$SOURCE_COMMIT" \
            > stratumind-api-image-release.json
          printf '%s\n' "Published ${IMAGE_REF}:${IMAGE_TAG}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "Source commit: ${SOURCE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stratumind-api-image-release
          path: stratumind-api-image-release.json
          if-no-files-found: error
